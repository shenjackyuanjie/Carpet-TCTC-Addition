pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()

        maven {
            name("Fabric")
            url("https://maven.fabricmc.net")
        }

        maven {
            name("Jitpack")
            url("https://jitpack.io")
        }

        maven {
            name("Nyan Maven")
            url("https://maven.hendrixshen.top")
        }

        maven {
            name("Cotton")
            url("https://server.bbkr.space/artifactory/libs-release")
        }
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.replaymod.preprocess") {
                // com.replaymod.preprocess:SNAPSHOT is no longer published to any of the
                // repositories above, so pull the plugin from the maintained fork via Jitpack.
                useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
            }
        }
    }

    // CI checks out the plugin sources next to the repository; building it as a composite
    // build keeps its dependencies (e.g. mapping-io) intact, which the Jitpack artifact lacks.
    def preprocessorSource = file("../preprocessor")
    if (preprocessorSource.exists()) {
        includeBuild(preprocessorSource)
    }
}

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
    }
    dependencies {
        // The Jitpack build of com.replaymod.preprocess does not declare its dependencies,
        // so provide mapping-io (used to read remap mappings) on the settings classpath.
        classpath "net.fabricmc:mapping-io:0.6.1"
    }
}

def versions = Arrays.asList(
        "1.14.4",
        "1.15.2",
        "1.16.5",
        "1.17.1",
        "1.18.2",
        "1.19.2",
        "1.19.3",
        "1.19.4",
        "1.20.1",
        "1.20.2",
        "1.20.4",
)

for (String version : versions) {
    include(":$version")
    def proj = project(":$version")
    proj.projectDir = file("versions/$version")
    proj.buildFileName = "../../common.gradle"
}

include(":fabricWrapper")
